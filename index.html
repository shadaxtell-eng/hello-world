<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .greeting {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      background: linear-gradient(90deg, #e94560, #0f3460, #53d8fb);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .subtitle {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
    }

    .divider {
      width: 60px;
      height: 3px;
      margin: 1.5rem auto;
      background: linear-gradient(90deg, #e94560, #53d8fb);
      border-radius: 2px;
    }

    .cta {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.7rem 2rem;
      background: linear-gradient(135deg, #e94560, #0f3460);
      color: #fff;
      border: none;
      border-radius: 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="greeting">Hello, World!</h1>
    <div class="divider"></div>
    <p class="subtitle">Welcome to my first project. The journey begins here. 🚀</p>
    <a class="cta" href="https://github.com/shadaxtell-eng/hello-world" target="_blank" rel="noopener noreferrer">
      View on GitHub
    </a>
  </div>
</body>
</html>
